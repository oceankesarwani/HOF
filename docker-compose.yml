services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      - ML_ENGINE_URL=http://ml-engine:8000
    depends_on:
      ml-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Note: Production uses the CMD defined in Dockerfile (npm start)

  ml-engine:
    build:
      context: ml-engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    volumes:
      # Data and Model Persistence
      - ./ml-engine/chroma_data:/app/chroma_data
      - huggingface-cache:/root/.cache/huggingface
      - sentence-transformers-cache:/root/.cache/torch

volumes:
  huggingface-cache:
  sentence-transformers-cache:
